specVersion: 1.0.0
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum
    name: VerimeshRegistry
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: VerimeshRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Decision
        - Freeze
        - Approval
        - Override
        - HumanAuthority
        - NodeHistory
        - Operator
      abis:
        - name: VerimeshRegistry
          file: ./abis/VerimeshRegistry.json
      eventHandlers:
        - event: Committed(indexed bytes32,string,string,string,string,uint8,bytes32,uint256)
          handler: handleCommitted
        - event: Frozen(indexed bytes32,string,string,string,uint8,uint8,uint256)
          handler: handleFrozen
        - event: HumanApproval(indexed bytes32,bytes32,string,uint8,uint256)
          handler: handleHumanApproval
        - event: OverrideResolved(indexed bytes32,string,uint8,uint256)
          handler: handleOverrideResolved
      file: ./src/mappings.ts
